version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: predictaguard_postgres
    restart: always
    environment:
      POSTGRES_DB: predictaguard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: astra_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predictaguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  predictaguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictaguard_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ASTRA_DB_HOST=postgres
      - ASTRA_DB_PORT=5432
      - ASTRA_DB_USER=postgres
      - ASTRA_DB_PASSWORD=astra_password
    volumes:
      - ./ml/models:/app/ml/models

volumes:
  postgres_data:
